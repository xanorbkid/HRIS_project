{% extends "components/base.html" %}
{% load static %}

{% block content %}
<div class="content-page">
    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-primary">Job Titles</h4>

            <a href="{% url 'jobtitle_create' %}" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i> Add Job Title
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="bg-primary text-white">
                        <tr>
                            <th>Name</th>
                            <th>Level</th>
                            <th>Description</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for job in jobtitles %}
                        <tr>
                            <td>{{ job.name }}</td>
                            <td>{{ job.level }}</td>
                            <td>{{ job.description|safe }}</td>

                            <td class="text-end">
                                <a href="{% url 'jobtitle_update' job.id %}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>

                                <a href="{% url 'jobtitle_delete' job.id %}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Delete this job title?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>

                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">No job titles found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
{% endblock %}
