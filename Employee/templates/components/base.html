  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const showConfirm = (options, onConfirm) => {
        Swal.fire({
          title: options.title || "Do you want to save the changes?",
          text: options.text || '',
          icon: options.icon || undefined,
          showDenyButton: true,
          showCancelButton: true,
          confirmButtonText: options.confirmButtonText || "Save",
          denyButtonText: options.denyButtonText || "Don't save",
          cancelButtonText: options.cancelButtonText || "Cancel",
          confirmButtonColor: options.confirmButtonColor,
          cancelButtonColor: options.cancelButtonColor,
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire(
              options.confirmedTitle || "Saved!",
              options.confirmedText || "",
              options.confirmedIcon || "success"
            ).then(() => {
              if (typeof onConfirm === 'function') {
                onConfirm();
              }
            });
          } else if (result.isDenied) {
            Swal.fire(
              options.deniedTitle || "Changes are not saved",
              options.deniedText || "",
              options.deniedIcon || "info"
            );
          }
        });
      };

      document.addEventListener('submit', function(event) {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) {
          return;
        }

        const identifier = (form.id || '').toLowerCase();
        const requiresConfirm =
          form.hasAttribute('data-swal-confirm') ||
          (identifier && identifier.includes('delete'));

        if (!requiresConfirm) {
          return;
        }

        if (form.dataset.swalConfirmed === 'true') {
          form.dataset.swalConfirmed = '';
          return;
        }

        event.preventDefault();

        showConfirm(
          {
            title: form.dataset.swalTitle,
            text: form.dataset.swalText,
            icon: form.dataset.swalIcon,
            confirmButtonColor: form.dataset.swalConfirmColor,
            cancelButtonColor: form.dataset.swalCancelColor,
            confirmButtonText: form.dataset.swalConfirmText,
            cancelButtonText: form.dataset.swalCancelText,
          },
          () => {
            form.dataset.swalConfirmed = 'true';
            form.submit();
          }
        );
      }, true);

      document.addEventListener('click', function(event) {
        const link = event.target.closest('a');
        if (!link || !link.href) {
          return;
        }

        if (link.dataset.swalIgnore === 'true') {
          return;
        }

        const href = link.getAttribute('href');
        const hasModalToggle = link.hasAttribute('data-bs-toggle');

        if (!href || href === '#' || hasModalToggle) {
          return;
        }

        const isDeleteLink =
          link.hasAttribute('data-swal-confirm') ||
          href.toLowerCase().includes('delete');

        if (!isDeleteLink) {
          return;
        }

        event.preventDefault();

        showConfirm(
          {
            title: link.dataset.swalTitle,
            text: link.dataset.swalText,
            icon: link.dataset.swalIcon,
            confirmButtonColor: link.dataset.swalConfirmColor,
            cancelButtonColor: link.dataset.swalCancelColor,
            confirmButtonText: link.dataset.swalConfirmText,
            cancelButtonText: link.dataset.swalCancelText,
          },
          () => {
            window.location.assign(href);
          }
        );
      }, true);
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const wrapper = document.querySelector('.wrapper');
      if (!wrapper) {
        return;
      }

      const directContentPage = Array.from(wrapper.children).find(child =>
        child.classList && child.classList.contains('content-page')
      );
      if (directContentPage) {
        return;
      }

      const topNav = Array.from(wrapper.children).find(child =>
        child.classList && child.classList.contains('iq-top-navbar')
      );
      if (!topNav) {
        return;
      }

      const nodesToWrap = [];
      let sibling = topNav.nextSibling;
      while (sibling) {
        const nextSibling = sibling.nextSibling;
        if (
          sibling.nodeType === Node.ELEMENT_NODE ||
          (sibling.nodeType === Node.TEXT_NODE && sibling.textContent.trim())
        ) {
          nodesToWrap.push(sibling);
        }
        sibling = nextSibling;
      }

      if (!nodesToWrap.length) {
        return;
      }

      const autoWrapper = document.createElement('div');
      autoWrapper.className = 'content-page auto-content-page';
      wrapper.insertBefore(autoWrapper, nodesToWrap[0]);
      nodesToWrap.forEach(node => {
        autoWrapper.appendChild(node);
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const addModernClasses = () => {
        document
          .querySelectorAll('.modal-body input:not([type="checkbox"]):not([type="radio"]):not(.form-control)')
          .forEach((input) => input.classList.add('form-control'));

        document
          .querySelectorAll('.modal-body select:not(.form-select)')
          .forEach((select) => select.classList.add('form-select'));

        document
          .querySelectorAll('.modal-body textarea:not(.form-control)')
          .forEach((textarea) => textarea.classList.add('form-control'));
      };

      addModernClasses();
      document.addEventListener('shown.bs.modal', addModernClasses);
    });
  </script>
