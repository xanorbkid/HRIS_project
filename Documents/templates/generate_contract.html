{% extends 'components/base.html' %}

{% block title %}Generate Contract{% endblock %}

{% block content %}
<div class="container mt-4">
    <h4 class="fw-bold mb-3">Generate Contract</h4>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'generate_contract' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
