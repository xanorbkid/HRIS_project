{% extends "components/base.html" %}
{% block content %}
<br /><br /><br />

<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h4>{{ title }}</h4>
    </div>
    <div class="card-body">

      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary" type="submit">Save</button>
        <a href="{% url 'onboarding-list' %}" class="btn btn-secondary">Cancel</a>
      </form>

    </div>
  </div>
</div>

{% endblock %}
