{% extends "components/base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header">
      <h5>Delete Interview</h5>
    </div>
    <div class="card-body text-center">
      <p>Are you sure you want to delete the interview for:</p>
      <h5>{{ interview.applicant }}</h5>

      <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger px-4">Delete</button>
        <a href="{% url 'interview-list' %}" class="btn btn-secondary px-4">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
