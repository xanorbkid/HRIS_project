{% extends "components/base.html" %}
{% load static %}

{% block title %}Delete Deduction{% endblock %}

{% block content %}
<div class="content-page">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Confirm Deletion</h5>
                    </div>
                    <div class="card-body">
                        <p>Do you really want to delete <strong>{{ deduction.name }}</strong>? This action cannot be undone.</p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex justify-content-end gap-2">
                                <a class="btn btn-outline-secondary" href="{% url 'deductions_benefits' %}">Cancel</a>
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
