{% extends 'components/base.html' %}
{% load static %}

{% block title %}Notification Settings{% endblock %}

{% block content %}
<div class="content-page">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0">Notification Preferences</h5>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="emailPreference"
                                       name="email_enabled" {% if preference.email_enabled %}checked{% endif %}>
                                <label class="form-check-label" for="emailPreference">Email alerts</label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="smsPreference"
                                       name="sms_enabled" {% if preference.sms_enabled %}checked{% endif %}>
                                <label class="form-check-label" for="smsPreference">SMS alerts</label>
                            </div>
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="inAppPreference"
                                       name="in_app_enabled" {% if preference.in_app_enabled %}checked{% endif %}>
                                <label class="form-check-label" for="inAppPreference">In-app notifications</label>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Save Changes</button>
                        </form>
                    </div>
                    <div class="card-footer text-muted">
                        Last updated {{ preference.updated_at|date:"M d, Y H:i" }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
